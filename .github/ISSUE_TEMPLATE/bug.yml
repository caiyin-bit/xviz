name: Bug report
description: Report a defect — something works incorrectly or crashes.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A minimal reproduction
        helps a lot — usually a data file + form file is enough.

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "xviz-cli"
        - "@minimal-viz/core"
        - "Both / unclear"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: "Output of `npm ls xviz-cli` or `npm ls @minimal-viz/core`."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: "Output of `node --version`."
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal steps. If it's a CLI bug, include the command you ran, plus
        the data + form files (paste contents or attach).
      placeholder: |
        ```bash
        xviz render -d data.json -f form.json -o out.png
        ```
        data.json:
        ```json
        [...]
        ```
        form.json:
        ```json
        {...}
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, or screenshots.
    validations:
      required: true
